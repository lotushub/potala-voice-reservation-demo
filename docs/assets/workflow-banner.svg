<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
<title id="title">Potala demo workflow</title>
<desc id="desc">A guest speaks to Vapi, Make checks the rules, and Google Calendar stores a demo reservation.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10203b"/><stop offset="1" stop-color="#25214a"/></linearGradient><linearGradient id="card" x2="1" y2="1"><stop stop-color="#263657"/><stop offset="1" stop-color="#34315d"/></linearGradient></defs>
<rect width="1100" height="360" rx="24" fill="url(#bg)"/>
<text x="550" y="66" fill="#f8fafc" font-size="31" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">From conversation to calendar</text>
<text x="550" y="97" fill="#cbd5e1" font-size="17" font-family="Arial, sans-serif" text-anchor="middle">A practice reservation, confirmed only after Make returns success</text>
<g font-family="Arial, sans-serif">
<rect x="52" y="140" width="213" height="145" rx="17" fill="url(#card)" stroke="#61718f"/>
<text x="158" y="190" fill="#a5f3fc" font-size="23" font-weight="700" text-anchor="middle">Guest</text>
<text x="158" y="225" fill="#dbeafe" font-size="16" text-anchor="middle">speaks on the web page</text>
<rect x="310" y="140" width="213" height="145" rx="17" fill="url(#card)" stroke="#61718f"/>
<text x="416" y="190" fill="#a5f3fc" font-size="23" font-weight="700" text-anchor="middle">Vapi</text>
<text x="416" y="225" fill="#dbeafe" font-size="16" text-anchor="middle">listens and responds</text>
<rect x="568" y="140" width="213" height="145" rx="17" fill="url(#card)" stroke="#61718f"/>
<text x="674" y="190" fill="#a5f3fc" font-size="23" font-weight="700" text-anchor="middle">Make</text>
<text x="674" y="225" fill="#dbeafe" font-size="16" text-anchor="middle">checks and updates</text>
<rect x="826" y="140" width="222" height="145" rx="17" fill="url(#card)" stroke="#61718f"/>
<text x="937" y="190" fill="#a5f3fc" font-size="23" font-weight="700" text-anchor="middle">Calendar</text>
<text x="937" y="225" fill="#dbeafe" font-size="16" text-anchor="middle">stores demo events</text>
<path d="M273 213h28m-10-8 10 8-10 8M531 213h28m-10-8 10 8-10 8M789 213h28m-10-8 10 8-10 8" stroke="#67e8f9" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="550" y="326" fill="#94a3b8" font-size="15" text-anchor="middle">Availability · New booking · Change booking</text>
</g></svg>